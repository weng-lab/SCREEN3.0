# Use a real node_modules tree rather than Yarn PnP.
# (Yarn's default is "pnp", which Next.js and much of the JS tooling
# ecosystem still handle poorly.)
nodeLinker: node-modules

# Yarn 4 blocks dependency install scripts by default. This project needs
# them for native binaries: sharp, @parcel/watcher, unrs-resolver.
enableScripts: true

# Yarn 4.18 quarantines versions published <1 day ago (npmMinimalAgeGate).
# Our own packages are exempt so fresh betas install immediately.
npmPreapprovedPackages:
  - "@weng-lab/*"

# Pin the Yarn version. The release binary is committed under .yarn/releases
# so CI and Vercel don't need Corepack to bootstrap it.
yarnPath: .yarn/releases/yarn-4.18.0.cjs
